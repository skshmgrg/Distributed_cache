version: "3.9"

# Five identical containers, each running the same jar. What makes
# each one a distinct "node" is only its NODE_ID and PORT env vars —
# there is no separate coordinator service.
#
# Right now (Phase 1) they don't know about each other yet — that
# comes in Phase 3 (sharding/ring) and Phase 4 (replication).
# For now, this just proves the pipeline: build -> containerize ->
# run 5 of them -> each responds on /ping.

services:
  node1:
    build: .
    environment:
      - NODE_ID=node1
      - PORT=8080
    ports:
      - "8081:8080"

  node2:
    build: .
    environment:
      - NODE_ID=node2
      - PORT=8080
    ports:
      - "8082:8080"

  node3:
    build: .
    environment:
      - NODE_ID=node3
      - PORT=8080
    ports:
      - "8083:8080"

  node4:
    build: .
    environment:
      - NODE_ID=node4
      - PORT=8080
    ports:
      - "8084:8080"

  node5:
    build: .
    environment:
      - NODE_ID=node5
      - PORT=8080
    ports:
      - "8085:8080"
