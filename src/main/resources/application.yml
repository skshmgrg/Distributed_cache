server:
  port: ${PORT:8080}

spring:
  application:
    name: distributed-cache

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always

# Custom property, read directly by HealthController for now.
# Later phases (ring membership, replication) will also read this
# to know which node this instance represents.
NODE_ID: ${NODE_ID:unknown-node}

# Phase 2: a bounded in-memory cache for this node only. Values expire after
# their individual TTL (or the default below), and the least recently used
# entry is evicted when the capacity is reached.
cache:
  max-entries: ${CACHE_MAX_ENTRIES:1000}
  default-ttl-seconds: ${CACHE_DEFAULT_TTL_SECONDS:3600}
  expiry-sweep-ms: ${CACHE_EXPIRY_SWEEP_MS:5000}
